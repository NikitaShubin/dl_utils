[project]
name = 'dl_utils'
version = "0.1.2"


######################
#        Ruff        #
######################

# Базовые настройки Ruff:
[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["ALL"]  # Включаем все категории правил Ruff

# Исключения из правил:
ignore = [
    # Конфликтующие правила pydocstyle:
    "D203",  # Конфликтует с D211
    "D213",  # Конфликтует с D212

    # Конфликты с форматером:
    # "COM812",  # Trailing comma
    "Q000",    # Несовместимость кавычек
    "Q003",    # Несовместимость кавычек

    # Временно отключено: правило стабилизировалось в ruff 0.16 и требует
    # копирайт-заголовок в начале каждого файла:
    # TODO: вернуть правило и проставить копирайт-заголовки во все файлы репозитория
    "CPY001",

    # Кириллица в комментариях и строках:
    "RUF001", "RUF002", "RUF003",

    # Игнорируем предупреждения о неизвестных noqa-кодах (например, для WPS):
    "RUF100",
    # Нужно для поочерёдного использования Ruff и WPS в одном проекте.
]

[tool.ruff.lint.per-file-ignores]
'__init__.py' = ['F401']  # неиспользуемый импорт в __init__
# Паттерн с ведущим ** - чтобы послабления действовали и для внешних проектов,
# которые чекер проверяет из своих директорий:
'**/tests/**' = ['S101', 'PLR2004']  # разрешаем assert и magic values в тестах
# Послабления для юпитер-ноутбуков:
'**/*.ipynb' = [
    'T201',    # чтобы использовать print
    'S101',    # чтобы использовать assert
    'PLR2004', # чтобы использовать магические числа вместо вынесения в константы
    'ERA001',  # чтобы хранить закомментированный код
]

# Настройки форматера:
[tool.ruff.format]
quote-style = "single"


######################
#    WPS & Flake8    #
######################

# Интеграция WPS во flake8 (пока не используется):
[tool.flake8]
max-line-length = 88
select = "WPS"      # Используем только правила WPS
ignore = "ALL"      # Игнорируем все остальные правила
format = "wemake"   # Формат вывода (опционально)
show-source = true  # Показываем коды ошибок
statistics = true


######################
#        Mypy        #
######################

[tool.mypy]
incremental = false         # без кеша: каждый прогон проверяет всё заново
show_error_codes = true     # печатать коды ошибок вида arg-type рядом с текстом
warn_unused_ignores = true  # ругаться на type: ignore, который ничего не глушит
follow_imports = 'skip'     # импортированные модули не проверять - только сам файл


######################
#      Coverage      #
######################

# Замер покрытия py-конвейером чекера: ветки считаются, тесты из метрик
# исключаются (их метрики не имеют смысла):
[tool.coverage.run]
branch = true
omit = ["tests/*"]


######################
#       Pytest       #
######################

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-v", "--strict-markers", "--strict-config"]
pythonpath = ["."]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests"
]
filterwarnings = ["error"]
